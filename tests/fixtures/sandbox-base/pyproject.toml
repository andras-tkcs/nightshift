[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox_pkg"
version = "0.1.0"
description = "Fixture package for Nightshift end-to-end tests"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["sandbox_pkg"]
