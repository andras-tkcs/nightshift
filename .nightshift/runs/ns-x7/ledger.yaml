request:
  text: 'Add ''ns note <id> "text"'': an owner-only command that appends a timestamped
    owner note to the run ledger (new ledger field owner_notes plus an ''owner-note''
    event, committed and pushed like stop_requested). The conductor reads unread notes
    at its existing between-step checkpoints (same places it checks stop_requested),
    treats them as owner instructions that override the plan''s scope, records them
    as read, and mentions them in the run report. Add it to the guard''s owner-only
    list, docs/usage.md, docs/ledger.md, docs/conductor.md and tests.'
