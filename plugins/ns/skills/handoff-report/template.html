<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handoff {{RUN_ID}}</title>
<style>
:root { --bg:#fbfbfa; --fg:#1d1d1b; --muted:#5f5f5a; --line:#d9d9d4; --card:#fff; --ok:#1a7f37; --bad:#b42318; --link:#0b5cad; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#16161a; --fg:#e8e8e4; --muted:#a0a09a; --line:#34343a; --card:#1e1e23; --ok:#4cc26b; --bad:#ff7b72; --link:#79b8ff; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
main { max-width:52rem; margin:0 auto; padding:16px; }
h1 { font-size:1.4rem; margin:0 0 4px; overflow-wrap:anywhere; }
h2 { font-size:1.1rem; margin:1rem 0 .5rem; border-bottom:1px solid var(--line); padding-bottom:4px; }
.meta { color:var(--muted); font-size:.9rem; margin:0 0 1rem; }
section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px 14px 12px; margin:12px 0; }
.scroll { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:.92rem; }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
th { color:var(--muted); font-weight:600; }
ul { padding-left:1.2rem; margin:.4rem 0; }
li { margin:.25rem 0; overflow-wrap:anywhere; }
a { color:var(--link); overflow-wrap:anywhere; }
.ok { color:var(--ok); font-weight:600; }
.bad { color:var(--bad); font-weight:600; }
</style>
</head>
<body>
<main>
<h1>{{TITLE}}</h1>
<p class="meta">Run {{RUN_ID}}</p>

<section>
<h2>Summary</h2>
{{SUMMARY}}
</section>

<section>
<h2>Pull request</h2>
<p><a href="{{PR_URL}}">{{PR_URL}}</a></p>
</section>

<section>
<h2>Phases</h2>
<div class="scroll">
<table>
<thead><tr><th>Phase</th><th>Title</th><th>Merge</th><th>Status</th></tr></thead>
<tbody>
{{PHASES_TABLE}}
</tbody>
</table>
</div>
</section>

<section>
<h2>Checks</h2>
<div class="scroll">
<table>
<thead><tr><th>Check</th><th>Result</th></tr></thead>
<tbody>
{{CHECKS_TABLE}}
</tbody>
</table>
</div>
</section>

<section>
<h2>Open findings</h2>
{{FINDINGS}}
</section>

<section>
<h2>Manual steps after merge</h2>
{{MANUAL_AFTER}}
</section>

<section>
<h2>Files on the desk</h2>
{{DESK_LINKS}}
</section>
</main>
</body>
</html>
